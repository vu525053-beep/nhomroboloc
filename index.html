<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VUSCRIPT - Ultimate Audio Fixed Edition</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, Helvetica, sans-serif; }

        /* ẨN TOÀN BỘ THANH CUỘN XẤU XÍ */
        *::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        #mainScreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; z-index: 1; display: none; }
        #mainScreen img { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: fill; display: block; }

        /* LOADING SCREEN */
        #loadingScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #050509; display: flex; justify-content: center; align-items: center; z-index: 200; transition: opacity 0.8s ease; cursor: pointer;
        }
        .loadingContainer { position: relative; width: 260px; height: 300px; display: flex; justify-content: center; align-items: center; pointer-events: none; }
        .loadingImage {
            position: absolute; width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255, 255, 255, 0.85); box-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 25px rgba(255,80,150,0.35); z-index: 5; animation: imagePulse 2s ease-in-out infinite;
        }
        .orbitOne { position: absolute; width: 190px; height: 190px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); animation: rotateOne 2.5s linear infinite; }
        .orbitTwo { position: absolute; width: 165px; height: 165px; border-radius: 50%; border: 2px solid rgba(255,70,150,0.25); animation: rotateTwo 3s linear infinite; }
        .whiteDot { position: absolute; width: 10px; height: 10px; top: -5px; left: 50%; transform: translateX(-50%); border-radius: 50%; background: white; box-shadow: 0 0 8px white; }
        .pinkDot { position: absolute; width: 8px; height: 8px; bottom: -4px; left: 50%; transform: translateX(-50%); border-radius: 50%; background: #ff4f9a; box-shadow: 0 0 10px #ff4f9a; }
        .loadingText { position: absolute; top: 245px; width: 100%; text-align: center; color: rgba(255,255,255,0.78); font-size: 14px; letter-spacing: 2px; }

        @keyframes rotateOne { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotateTwo { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        @keyframes imagePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

        /* MÀN HÌNH ĐĂNG NHẬP */
        #nameScreen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.2); display: none; justify-content: center; align-items: center; z-index: 150; opacity: 0; transition: opacity 0.8s ease; backdrop-filter: blur(4px);
        }
        .nameBox { width: 390px; padding: 34px; text-align: center; background: rgba(10,10,15,0.55); border: 1px solid rgba(255,255,255,0.25); border-radius: 22px; box-shadow: 0 0 35px rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
        .nameTitle { color: #fff; font-size: 22px; font-weight: bold; margin-bottom: 8px; }
        .nameDescription { color: rgba(255,255,255,0.8); font-size: 13px; margin-bottom: 18px; }
        .inputField { width: 100%; height: 44px; padding: 0 16px; border: 1px solid rgba(255,255,255,0.25); border-radius: 12px; outline: none; background: rgba(0,0,0,0.3); color: #fff; font-size: 14px; text-align: center; margin-bottom: 10px; }
        #enterButton { width: 100%; height: 44px; border: none; border-radius: 12px; background: #ff4f9a; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        /* GIAO DIỆN CHÍNH */
        .robloxLauncher {
            position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); width: 410px; display: none; flex-direction: column; gap: 8px; z-index: 20; opacity: 0; transition: opacity 0.8s ease;
        }
        .menuButtonRow { display: flex; gap: 4px; }
        .menuBtn {
            flex: 1; height: 40px; background: rgba(20, 20, 30, 0.55); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; color: #fff; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 2px; backdrop-filter: blur(8px);
        }
        .menuBtn:hover { background: rgba(255,79,154,0.4); border-color: #ff4f9a; }
        
        .robloxButton {
            width: 100%; height: 44px; border: 1px solid rgba(255,255,255,0.3); border-radius: 12px; background: rgba(15, 15, 25, 0.5); color: white; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.25s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); backdrop-filter: blur(8px);
            text-decoration: none;
        }
        .robloxButton:hover { background: rgba(255,255,255,0.25); border-color: #ff4f9a; }
        
        /* 🌈 SCRIPT HUB - CẦU VỒNG LẤP LÁNH CHẠY TỪ TRÁI SANG PHẢI */
        #btnScriptHub {
            background: linear-gradient(
                90deg,
                #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000
            );
            background-size: 400% 100%;
            animation: rainbowMove 4s linear infinite;

            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng vệt sáng lấp lânh chạy qua */
        #btnScriptHub::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                transparent,
                rgba(255, 255, 255, 0.6),
                transparent
            );
            transform: rotate(30deg) translateX(-100%);
            animation: sparkleSweep 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        /* ✨ NÚT TẢI DELTA X 101 - HIỆU ỨNG SÁNG XANH TÍM SIU ĐẸP */
        #btnDownloadDelta {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.6), rgba(168, 85, 247, 0.6));
            border: 1px solid rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        #btnDownloadDelta:hover {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.8), rgba(168, 85, 247, 0.8));
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }

        @keyframes rainbowMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }

        @keyframes sparkleSweep {
            0% { transform: rotate(30deg) translateX(-100%); }
            100% { transform: rotate(30deg) translateX(100%); }
        }

        #btnRobloxVNG { background: linear-gradient(135deg, rgba(30,30,50,0.6), rgba(60,20,40,0.6)); }

        /* MODAL CHUNG */
        .modalBox {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 430px; max-height: 90vh; background: rgba(12, 12, 18, 0.65); border: 1px solid rgba(255, 79, 154, 0.45); border-radius: 18px; padding: 16px; display: none; flex-direction: column; gap: 12px; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.6); backdrop-filter: blur(12px); opacity: 0; transition: 0.3s ease;
        }
        .modalBox.active { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        .modalHeader { display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 15px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; }
        .closeModal { background: none; border: none; color: #ff4f9a; font-size: 18px; cursor: pointer; font-weight: bold; }

        /* SCRIPT HUB STYLES */
        #scriptHubModal { width: 410px !important; border: 2px solid rgba(56, 189, 248, 0.6); background: rgba(10, 15, 30, 0.65); backdrop-filter: blur(12px); }
        .scriptHubContainer { max-height: 440px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 2px; }
        .script-hub-top-banner { width: 100%; background: linear-gradient(135deg, rgba(2, 132, 199, 0.3), rgba(147, 51, 234, 0.3)); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 12px; padding: 14px; text-align: center; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
        .script-hub-banner-title { color: #38bdf8; font-size: 16px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
        .script-hub-banner-desc { color: #cbd5e1; font-size: 11px; }
        .game-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .game-btn { background: rgba(30, 41, 59, 0.6); color: white; border: 1px solid rgba(255,255,255,0.15); padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.25s; text-align: center; backdrop-filter: blur(4px); }
        .game-btn:hover { background: rgba(2, 132, 199, 0.5); border-color: #38bdf8; }
        .game-btn.active { background: linear-gradient(135deg, #0284c7, #2563eb); border-color: #38bdf8; }
        .section-title { font-size: 12px; margin-top: 4px; color: #38bdf8; border-left: 3px solid #38bdf8; padding-left: 8px; font-weight: bold; }
        .script-card { background: rgba(15, 23, 42, 0.6); border-radius: 10px; padding: 10px 12px; border: 1px solid rgba(56, 189, 248, 0.25); display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(4px); }
        .script-name { font-weight: bold; color: #38bdf8; font-size: 12px; margin-bottom: 3px; }
        .script-code-text { font-family: monospace; color: #cbd5e1; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; background: rgba(0,0,0,0.4); padding: 3px 6px; border-radius: 4px; }
        .copy-btn { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .contrib-box { margin-top: 4px; background: rgba(17, 24, 39, 0.65); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(4px); }
        .contrib-box h3 { font-size: 12px; color: #f3f4f6; font-weight: bold; }
        .input-field-hub { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 10px; border-radius: 8px; font-size: 11px; outline: none; }
        textarea.input-field-hub { resize: vertical; height: 50px; font-family: monospace; }
        .submit-btn-hub { width: 100%; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none; padding: 9px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; }

        /* BẠN BÈ & GỌI */
        .friendListContainer { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .friendItem { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.06); padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #fff; }
        .friendActions { display: flex; gap: 6px; align-items: center; }
        .callUserBtn { background: #22c55e; border: none; color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .deleteUserBtn { background: #ef4444; border: none; color: white; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .statusBadge { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot.online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .dot.offline { background: #6b7280; }

        /* CHÁT NHÓM */
        .chatHeaderActions { display: flex; gap: 6px; align-items: center; }
        .resetChatBtn { background: #ef4444; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .chatMessagesBox { height: 220px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; text-align: left; backdrop-filter: blur(4px); }
        .msgRow { font-size: 12px; color: #e5e7eb; background: rgba(255,255,255,0.08); padding: 8px 12px; border-radius: 8px; word-break: break-word; line-height: 1.4; display: flex; justify-content: space-between; align-items: flex-start; }
        .msgRow b { color: #ff4f9a; }
        .deleteMsgBtn { background: none; border: none; color: #ef4444; font-size: 12px; cursor: pointer; font-weight: bold; margin-left: 8px; display: none; }
        .msgRow:hover .deleteMsgBtn { display: inline-block; }
        .chatInputRow { display: flex; gap: 6px; }
        .chatInputRow input { flex: 1; height: 38px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 0 12px; color: #fff; font-size: 12px; outline: none; }
        .chatInputRow button { width: 65px; height: 38px; background: #ff4f9a; border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 12px; cursor: pointer; }

        /* SHOP & CHART - TRONG SUỐT XUYÊN THẤU NỀN */
        #shopModal {
            background: rgba(8, 8, 14, 0.45) !important;
            border: 1px solid rgba(52, 211, 153, 0.35);
            backdrop-filter: blur(8px) !important;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .shopContainer { max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chartBox { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px; position: relative; height: 170px; backdrop-filter: blur(3px); }
        .orderFormBox { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(3px); }
        .orderFormTitle { color: #34d399; font-size: 12px; font-weight: bold; }
        .formRow { display: flex; gap: 6px; }
        .formRow input { flex: 1; height: 36px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff; padding: 0 10px; font-size: 12px; outline: none; }
        .submitOrderBtn { width: 100%; height: 36px; background: #34d399; border: none; border-radius: 8px; color: #000; font-weight: bold; font-size: 12px; cursor: pointer; }
        .adminSection { background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(3px); }
        .adminHeader { display: flex; justify-content: space-between; align-items: center; }
        .adminTitle { color: #f87171; font-size: 12px; font-weight: bold; }
        .pendingList { max-height: 110px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .pendingCard { background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #fff; backdrop-filter: blur(2px); }
        .adminActions { display: flex; gap: 4px; }
        .approveBtn { background: #22c55e; border: none; color: white; padding: 3px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; }
        .rejectBtn { background: #ef4444; border: none; color: white; padding: 3px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; }
        .deleteApprovedBtn { background: #b91c1c; border: none; color: white; padding: 3px 6px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; }

        /* GỌI THOẠI P2P */
        .callScreenBody { text-align: center; padding: 5px 0; display: flex; flex-direction: column; gap: 12px; align-items: center; color: #fff; }
        .callAvatarPulse { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #ff4f9a, #a855f7); display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 0 20px rgba(255,79,154,0.6); animation: ringPulse 1.5s infinite; }
        @keyframes ringPulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        .callActionButtons { display: flex; gap: 8px; width: 100%; justify-content: center; margin-top: 10px; }
        .callBtn { padding: 8px 16px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; color: #fff; font-size: 12px; }
        .btnEndCall { background: #ef4444; }
        .btnMute { background: #374151; }

        /* POPUP GỌI ĐẾN */
        #incomingModal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 300; backdrop-filter: blur(5px); }
        .incomingBox { width: 320px; background: rgba(20,20,30,0.75); border: 1px solid #ff4f9a; border-radius: 20px; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 0 30px rgba(255,79,154,0.4); backdrop-filter: blur(12px); }
        .incomingAvatar { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #22c55e, #3b82f6); margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .incomingButtons { display: flex; gap: 12px; justify-content: center; }
        .btnAccept { background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .btnReject { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* CUSTOM ALERT */
        #customModalBox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); justify-content: center; align-items: center; z-index: 500; backdrop-filter: blur(6px); }
        .custom-modal-content { background: rgba(30, 41, 59, 0.85); padding: 20px; border-radius: 14px; width: 90%; max-width: 320px; text-align: center; border: 1px solid #475569; backdrop-filter: blur(10px); }
        .custom-modal-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; color: #38bdf8; }
        .custom-modal-msg { font-size: 13px; color: #cbd5e1; margin-bottom: 14px; line-height: 1.4; }
        .custom-modal-ok { background: #0284c7; color: white; border: none; padding: 6px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
    </style>
</head>

<body>

    <div id="mainScreen"><img src="bg_animated.gif" alt=""></div>

    <div id="loadingScreen">
        <div class="loadingContainer">
            <div class="orbitOne"><div class="whiteDot"></div></div>
            <div class="orbitTwo"><div class="pinkDot"></div></div>
            <img class="loadingImage" src="loading.jpg" alt="">
            <div class="loadingText">ĐANG TẢI...</div>
        </div>
    </div>

    <div id="nameScreen">
        <div class="nameBox">
            <div class="nameTitle">Bốm tải xog r nhập đi 🖕</div>
            <div class="nameDescription">Nhập tên và mật khẩu để tham gia hệ thống 👇</div>
            <input id="nameInput" class="inputField" type="text" placeholder="Tên hiển thị..." maxlength="30" autocomplete="off">
            <input id="passInput" class="inputField" type="password" placeholder="Mật khẩu..." maxlength="30" autocomplete="off">
            <button id="enterButton" onclick="handleAuth()">ENTER</button>
        </div>
    </div>

    <div id="incomingModal">
        <div class="incomingBox">
            <div class="incomingAvatar">📞</div>
            <div>
                <div style="font-size: 14px; color: #cbd5e1;">Có cuộc gọi thoại đến</div>
                <div id="callerNameText" style="font-size: 18px; font-weight: bold; color: #ff4f9a; margin-top: 4px;">Đại vương</div>
            </div>
            <div class="incomingButtons">
                <button class="btnReject" onclick="rejectIncomingCall()">Từ chối</button>
                <button class="btnAccept" onclick="acceptIncomingCall()">Nghe máy</button>
            </div>
        </div>
    </div>

    <div id="friendModal" class="modalBox">
        <div class="modalHeader">
            <span>👥 Danh sách bạn bè & Quản trị</span>
            <button class="closeModal" onclick="closeModal('friendModal')">×</button>
        </div>
        <div class="friendListContainer" id="friendListContainer"></div>
    </div>

    <div id="chatModal" class="modalBox">
        <div class="modalHeader">
            <span>💬 Chat Nhóm Chung</span>
            <div class="chatHeaderActions">
                <button class="resetChatBtn" onclick="requestResetChat()">Reset Chat</button>
                <button class="closeModal" onclick="closeModal('chatModal')">×</button>
            </div>
        </div>
        <div class="chatMessagesBox" id="modalChatList"></div>
        <div class="chatInputRow">
            <input type="text" id="modalChatInput" placeholder="Nhập tin nhắn..." onkeypress="checkModalEnter(event)">
            <button onclick="sendModalChat()">Gửi</button>
        </div>
    </div>

    <!-- KHUNG TẢI DELTA MỚI NHẤT ĐÃ ĐƯỢC THÊM VÀO DƯỚI ĐÂY -->
    <div style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 250; text-align: center;">
        <a id="btnDownloadDelta" href="https://drive.google.com/file/d/1wIivccguMSngh4Q0g7hI4fCy_lLCl2DL/view?usp=sharing" target="_blank" class="robloxButton" style="padding: 12px 24px; font-size: 14px; text-decoration: none; display: inline-block;">
            📥 Nhấn vào đây để tải bản Delta mới nhất
        </a>
    </div>

    <div id="scriptHubModal" class="modalBox">
        <div class="modalHeader">
            <span>⚡ VIP Script Hub Đỉnh Cao</span>
            <button class="closeModal" onclick="closeModal('scriptHubModal')">×</button>
